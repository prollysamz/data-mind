joins:
- from_table: CUSTOMER
  to_table: NATION
  on_condition: CUSTOMER.C_NATIONKEY = NATION.N_NATIONKEY
  relationship: many_to_one
- from_table: NATION
  to_table: REGION
  on_condition: NATION.N_REGIONKEY = REGION.R_REGIONKEY
  relationship: many_to_one
- from_table: ORDERS
  to_table: CUSTOMER
  on_condition: ORDERS.O_CUSTKEY = CUSTOMER.C_CUSTKEY
  relationship: many_to_one
- from_table: LINEITEM
  to_table: ORDERS
  on_condition: LINEITEM.L_ORDERKEY = ORDERS.O_ORDERKEY
  relationship: many_to_one
- from_table: LINEITEM
  to_table: PART
  on_condition: LINEITEM.L_PARTKEY = PART.P_PARTKEY
  relationship: many_to_one
- from_table: LINEITEM
  to_table: SUPPLIER
  on_condition: LINEITEM.L_SUPPKEY = SUPPLIER.S_SUPPKEY
  relationship: many_to_one
- from_table: PARTSUPP
  to_table: PART
  on_condition: PARTSUPP.PS_PARTKEY = PART.P_PARTKEY
  relationship: many_to_one
- from_table: PARTSUPP
  to_table: SUPPLIER
  on_condition: PARTSUPP.PS_SUPPKEY = SUPPLIER.S_SUPPKEY
  relationship: many_to_one
- from_table: SUPPLIER
  to_table: NATION
  on_condition: SUPPLIER.S_NATIONKEY = NATION.N_NATIONKEY
  relationship: many_to_one
