name: saas_sales_and_support
description: E-commerce SaaS sales transactions, products catalog, and customer support tickets.
default_currency: USD
currency_symbol: "$"

tables:
  - name: PRODUCTS
    description: Master catalog of SaaS products and list prices.
    primary_key: [product_id]
    columns:
      - name: product_id
        type: INTEGER
        description: Unique product identifier
        is_primary_key: true
      - name: product_name
        type: VARCHAR
        description: Product commercial name (e.g. Novaship, CloudSync, DataFlow)
      - name: category
        type: VARCHAR
        description: Product category (e.g. Logistics, Infrastructure, Analytics)
      - name: base_price
        type: DECIMAL(10, 2)
        description: Default list price in USD

  - name: SALES
    description: Individual order sales transactions recorded by date and product.
    primary_key: [order_id, line_no]
    columns:
      - name: order_id
        type: INTEGER
        description: Unique order identifier
        is_primary_key: true
      - name: line_no
        type: INTEGER
        description: Line item number within order
        is_primary_key: true
      - name: order_date
        type: DATE
        description: Exact timestamp date of the sale
      - name: order_month
        type: DATE
        description: Truncated first day of the month for the order (YYYY-MM-01)
      - name: product_id
        type: INTEGER
        description: Foreign key referencing PRODUCTS.product_id
      - name: product_name
        type: VARCHAR
        description: Product name at time of sale
      - name: quantity
        type: INTEGER
        description: Quantity of units sold
      - name: amount
        type: DECIMAL(12, 2)
        description: Total line amount in USD

  - name: SUPPORT_TICKETS
    description: Customer support complaints, outage reports, and feedback.
    primary_key: [ticket_id]
    columns:
      - name: ticket_id
        type: VARCHAR
        description: Unique ticket identifier (e.g. TK-1001)
        is_primary_key: true
      - name: created_at
        type: DATE
        description: Date ticket was opened
      - name: product_name
        type: VARCHAR
        description: Product associated with the complaint or feedback
      - name: category
        type: VARCHAR
        description: Ticket category (e.g. Performance, Billing, Outage, Churn)
      - name: priority
        type: VARCHAR
        description: Ticket severity priority (e.g. Critical, Urgent, High, Medium, Low)
      - name: body
        type: VARCHAR
        description: Full text description of the customer issue or complaint

metrics:
  - name: revenue
    description: Total gross sales revenue
    table: SALES
    expression: SUM(amount)
    dimensions: [product_name, order_month]

  - name: mom_change
    description: Month-over-month signed change in sales revenue (current - previous). Positive value indicates growth/increase; negative value indicates drop/decline.
    table: SALES
    expression: SUM(amount) - LAG(SUM(amount)) OVER (PARTITION BY product_name ORDER BY order_month)
    dimensions: [product_name, order_month]

  - name: mom_revenue_decline
    description: Month-over-month decline in sales revenue (previous - current). Positive value indicates revenue drop/decline; negative value indicates revenue growth/increase.
    table: SALES
    expression: LAG(SUM(amount)) OVER (PARTITION BY product_name ORDER BY order_month) - SUM(amount)
    dimensions: [product_name, order_month]
    sql_template: |
      WITH monthly_revenue AS (
          SELECT
              product_name,
              order_month,
              SUM(amount) AS monthly_sales
          FROM SALES
          GROUP BY product_name, order_month
      ),
      revenue_changes AS (
          SELECT
              product_name,
              order_month,
              monthly_sales,
              LAG(monthly_sales) OVER (PARTITION BY product_name ORDER BY order_month) AS prev_month_sales,
              LAG(monthly_sales) OVER (PARTITION BY product_name ORDER BY order_month) - monthly_sales AS mom_revenue_decline
          FROM monthly_revenue
      )
      SELECT
          product_name,
          order_month,
          prev_month_sales,
          monthly_sales,
          mom_revenue_decline
      FROM revenue_changes
      WHERE prev_month_sales IS NOT NULL
      ORDER BY mom_revenue_decline DESC;

  - name: ticket_count
    description: Total number of customer support tickets
    table: SUPPORT_TICKETS
    expression: COUNT(ticket_id)
    dimensions: [product_name, category, priority]

joins:
  - from_table: SALES
    to_table: PRODUCTS
    on_condition: SALES.product_id = PRODUCTS.product_id
    join_type: LEFT

  - from_table: SUPPORT_TICKETS
    to_table: SALES
    on_condition: SUPPORT_TICKETS.product_name = SALES.product_name
    join_type: LEFT

verified_queries:
  - name: mom_revenue_decline_ranking
    question: "Which products experienced the largest month-over-month revenue decline?"
    sql: |
      WITH monthly_revenue AS (
          SELECT
              product_name,
              order_month,
              SUM(amount) AS monthly_sales
          FROM SALES
          GROUP BY product_name, order_month
      ),
      revenue_changes AS (
          SELECT
              product_name,
              order_month,
              monthly_sales,
              LAG(monthly_sales) OVER (PARTITION BY product_name ORDER BY order_month) AS prev_month_sales,
              LAG(monthly_sales) OVER (PARTITION BY product_name ORDER BY order_month) - monthly_sales AS mom_revenue_decline
          FROM monthly_revenue
      )
      SELECT
          product_name,
          order_month,
          prev_month_sales,
          monthly_sales,
          mom_revenue_decline
      FROM revenue_changes
      WHERE prev_month_sales IS NOT NULL AND mom_revenue_decline > 0
      ORDER BY mom_revenue_decline DESC;
    explanation: "Aggregates revenue by product and month, computes LAG window function, filters to positive declines, and sorts descending."

  - name: mom_decline_specific_month
    question: "What was our month-over-month revenue decline in March 2026?"
    sql: |
      WITH monthly_revenue AS (
          SELECT
              product_name,
              order_month,
              SUM(amount) AS monthly_sales
          FROM SALES
          GROUP BY product_name, order_month
      ),
      revenue_changes AS (
          SELECT
              product_name,
              order_month,
              monthly_sales,
              LAG(monthly_sales) OVER (PARTITION BY product_name ORDER BY order_month) AS prev_month_sales,
              LAG(monthly_sales) OVER (PARTITION BY product_name ORDER BY order_month) - monthly_sales AS mom_revenue_decline,
              monthly_sales - LAG(monthly_sales) OVER (PARTITION BY product_name ORDER BY order_month) AS mom_change
          FROM monthly_revenue
      )
      SELECT
          product_name,
          order_month,
          prev_month_sales,
          monthly_sales,
          mom_revenue_decline,
          mom_change
      FROM revenue_changes
      WHERE order_month = '2026-03-01' AND prev_month_sales IS NOT NULL
      ORDER BY mom_revenue_decline DESC;
    explanation: "Calculates monthly revenue across all months so LAG accesses the previous month (Feb 2026), then filters to March 2026 in the outer query."

  - name: max_discount_diff
    question: "What is the largest dollar discount between the catalog base price and the actual unit sale price?"
    sql: |
      SELECT MAX(p.base_price - (s.amount / s.quantity)) AS max_discount
      FROM SALES s
      JOIN PRODUCTS p ON s.product_id = p.product_id
      WHERE (s.amount / s.quantity) < p.base_price;
    explanation: "Computes unit sale price as (s.amount / s.quantity) and compares against catalog unit price p.base_price."

  - name: products_zero_outages
    question: "Which products in the catalog have zero recorded outage tickets?"
    sql: |
      SELECT p.product_name
      FROM PRODUCTS p
      WHERE p.product_name NOT IN (
          SELECT DISTINCT product_name FROM SUPPORT_TICKETS WHERE category = 'Outage'
      )
      ORDER BY p.product_name;
    explanation: "Selects product names from PRODUCTS not appearing in outage support tickets."


