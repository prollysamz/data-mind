questions:
  - id: S_Q1_AVG_UNIT_PRICE_BY_CAT
    question: "What is the average realized price per unit (amount / quantity) for each product category?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT p.category, ROUND(SUM(s.amount) / SUM(s.quantity), 2) AS avg_unit_price
      FROM SALES s
      JOIN PRODUCTS p ON s.product_id = p.product_id
      GROUP BY p.category
      ORDER BY avg_unit_price DESC;

  - id: S_Q2_ORDERS_OVER_1000
    question: "How many customer orders had a total order value greater than $1,000?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT COUNT(*) AS high_value_order_count
      FROM (
          SELECT order_id, SUM(amount) AS ord_total
          FROM SALES
          GROUP BY order_id
          HAVING SUM(amount) > 1000
      );

  - id: S_Q3_PRODUCT_HIGH_SEVERITY_TICKETS
    question: "Which product received the greatest number of High, Urgent, or Critical support tickets?"
    domain: support
    required_tools: [run_sql]
    expected_top_product: "Novaship"
    ground_truth_sql: |
      SELECT product_name, COUNT(*) AS urgent_tickets
      FROM SUPPORT_TICKETS
      WHERE priority IN ('High', 'Urgent', 'Critical')
      GROUP BY product_name
      ORDER BY urgent_tickets DESC
      LIMIT 1;

  - id: S_Q4_FEB_REVENUE_PERCENT
    question: "What percentage of overall sales revenue was generated in February 2026?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      WITH totals AS (SELECT SUM(amount) AS all_rev FROM SALES),
      feb AS (SELECT SUM(amount) AS feb_rev FROM SALES WHERE order_month = '2026-02-01')
      SELECT ROUND(feb.feb_rev * 100.0 / totals.all_rev, 2) AS feb_pct
      FROM totals, feb;

  - id: S_Q5_DISTINCT_SALE_DATES
    question: "Across how many distinct calendar dates were sales transactions recorded?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT COUNT(DISTINCT order_date) AS active_days
      FROM SALES;

  - id: S_Q6_BASE_PRICE_SPREAD
    question: "What is the difference between the highest and lowest catalog base price?"
    domain: catalog
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT MAX(base_price) - MIN(base_price) AS price_spread
      FROM PRODUCTS;

  - id: S_Q7_LOGISTICS_SUPPORT_TICKETS
    question: "How many customer support tickets were submitted for products in the Logistics category?"
    domain: mixed
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT COUNT(*) AS logistics_ticket_count
      FROM SUPPORT_TICKETS st
      JOIN PRODUCTS p ON st.product_name = p.product_name
      WHERE p.category = 'Logistics';

  - id: S_Q8_SINGLE_UNIT_ORDERS
    question: "How many sales line items had a quantity of exactly 1 unit?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT COUNT(*) AS single_unit_lines
      FROM SALES
      WHERE quantity = 1;

  - id: S_Q9_TICKETS_BY_PRIORITY
    question: "What is the total number of support tickets broken down by priority level?"
    domain: support
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT priority, COUNT(*) AS ticket_count
      FROM SUPPORT_TICKETS
      GROUP BY priority
      ORDER BY ticket_count DESC;

  - id: S_Q10_TOTAL_CATALOG_PRODUCTS
    question: "How many distinct products are listed in the product catalog?"
    domain: catalog
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT COUNT(*) AS catalog_product_count
      FROM PRODUCTS;

  - id: S_Q11_JANUARY_2026_REVENUE
    question: "What was the total sales revenue recorded for the month of January 2026?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT ROUND(SUM(amount), 2) AS jan_revenue
      FROM SALES
      WHERE order_month = '2026-01-01';

  - id: S_Q12_LOWEST_REALIZED_PRICE_PRODUCT
    question: "Which product had the lowest overall average realized unit price (amount / quantity)?"
    domain: sales
    required_tools: [run_sql]
    expected_top_product: "CloudSync"
    ground_truth_sql: |
      SELECT product_name, ROUND(SUM(amount) / SUM(quantity), 2) AS avg_unit_price
      FROM SALES
      GROUP BY product_name
      ORDER BY avg_unit_price ASC
      LIMIT 1;

  - id: S_Q13_TOTAL_UNITS_SOLD_OVERALL
    question: "What is the total quantity of all product units sold across the sales transactions?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT SUM(quantity) AS total_units_sold
      FROM SALES;

  - id: S_Q14_TOTAL_SECURITY_REVENUE
    question: "What was the total revenue generated by products in the Security category?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT ROUND(SUM(s.amount), 2) AS security_revenue
      FROM SALES s
      JOIN PRODUCTS p ON s.product_id = p.product_id
      WHERE p.category = 'Security';

  - id: S_Q15_AVERAGE_ORDER_QUANTITY
    question: "What is the average quantity of units per sales transaction line?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT ROUND(AVG(quantity), 2) AS avg_units_per_line
      FROM SALES;

  - id: S_Q16_MAX_LINE_ITEM_AMOUNT
    question: "What was the highest single transaction amount recorded in the sales data?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT MAX(amount) AS max_amount
      FROM SALES;

  - id: S_Q17_MARCH_2026_ORDER_COUNT
    question: "How many sales transactions were recorded in the month of March 2026?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT COUNT(*) AS march_order_count
      FROM SALES
      WHERE order_month = '2026-03-01';

  - id: S_Q18_CRITICAL_PRIORITY_PRODUCT
    question: "Which product accumulated the highest count of Critical priority support tickets?"
    domain: support
    required_tools: [run_sql]
    expected_top_product: "Novaship"
    ground_truth_sql: |
      SELECT product_name, COUNT(*) AS critical_count
      FROM SUPPORT_TICKETS
      WHERE priority = 'Critical'
      GROUP BY product_name
      ORDER BY critical_count DESC
      LIMIT 1;

  - id: S_Q19_AVERAGE_CATALOG_BASE_PRICE
    question: "What is the average base catalog price across all products?"
    domain: catalog
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT ROUND(AVG(base_price), 2) AS avg_base_price
      FROM PRODUCTS;

  - id: S_Q20_TOTAL_OUTAGE_TICKETS
    question: "How many support tickets had the category 'Outage'?"
    domain: support
    required_tools: [run_sql]
    ground_truth_sql: |
      SELECT COUNT(*) AS outage_ticket_count
      FROM SUPPORT_TICKETS
      WHERE category = 'Outage';

