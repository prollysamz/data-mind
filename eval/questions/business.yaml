questions:
  - id: Q_MOM_DECLINE
    question: "Which products experienced the largest month-over-month revenue decline?"
    domain: sales
    required_tools: [run_sql]
    expected_top_product: "Novaship"
    expected_decline_month: "2026-03-01"
    ground_truth_sql: |
      WITH monthly_revenue AS (
          SELECT
              product_name,
              order_month,
              SUM(amount) AS monthly_sales
          FROM SALES
          GROUP BY product_name, order_month
      ),
      revenue_changes AS (
          SELECT
              product_name,
              order_month,
              monthly_sales,
              LAG(monthly_sales) OVER (PARTITION BY product_name ORDER BY order_month) AS prev_month_sales,
              LAG(monthly_sales) OVER (PARTITION BY product_name ORDER BY order_month) - monthly_sales AS mom_revenue_decline
          FROM monthly_revenue
      )
      SELECT
          product_name,
          order_month,
          prev_month_sales,
          monthly_sales,
          mom_revenue_decline
      FROM revenue_changes
      WHERE prev_month_sales IS NOT NULL AND mom_revenue_decline > 0
      ORDER BY mom_revenue_decline DESC;

  - id: Q_MIXED_REVENUE_SUPPORT
    question: "Which products experienced the largest month-over-month revenue decline and what were customer complaints about that product?"
    domain: mixed
    required_tools: [run_sql, search_documents]
    expected_top_product: "Novaship"
    expected_complaint_themes: ["API latency", "504 gateway timeouts", "billing", "duplicate billing", "outage", "downtime"]

  - id: Q_TOTAL_REVENUE
    question: "What is the total sales revenue across all products in the database?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: "SELECT SUM(amount) AS total_revenue FROM SALES;"

  - id: Q_PRODUCTS_CATALOG
    question: "List all product categories and their default base prices from the products catalog."
    domain: catalog
    required_tools: [run_sql]
    ground_truth_sql: "SELECT category, base_price FROM PRODUCTS ORDER BY category;"

  - id: Q_TOP_SELLING_PRODUCT
    question: "Which product generated the highest total revenue?"
    domain: sales
    required_tools: [run_sql]
    expected_top_product: "SecureVault"
    ground_truth_sql: "SELECT product_name, SUM(amount) AS total_revenue FROM SALES GROUP BY product_name ORDER BY total_revenue DESC LIMIT 1;"

  - id: Q_TOTAL_UNITS_SOLD
    question: "How many total units were sold across all orders?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: "SELECT SUM(quantity) AS total_units FROM SALES;"

  - id: Q_AVG_ORDER_VALUE
    question: "What is the average order line amount across all sales?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: "SELECT AVG(amount) AS avg_line_amount FROM SALES;"

  - id: Q_MONTHLY_REVENUE_TREND
    question: "What was the total sales revenue for each month?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: "SELECT order_month, SUM(amount) AS monthly_revenue FROM SALES GROUP BY order_month ORDER BY order_month;"

  - id: Q_LOGISTICS_CATEGORY_REVENUE
    question: "What is the total sales revenue generated by products in the Logistics category?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: "SELECT SUM(s.amount) AS category_revenue FROM SALES s JOIN PRODUCTS p ON s.product_id = p.product_id WHERE p.category = 'Logistics';"

  - id: Q_SECURITY_CATEGORY_REVENUE
    question: "What is the total revenue for the Security category?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: "SELECT SUM(s.amount) AS security_revenue FROM SALES s JOIN PRODUCTS p ON s.product_id = p.product_id WHERE p.category = 'Security';"

  - id: Q_NOVASHIP_MARCH_SALES
    question: "What was the total sales amount for Novaship in March 2026?"
    domain: sales
    required_tools: [run_sql]
    expected_top_product: "Novaship"
    ground_truth_sql: "SELECT SUM(amount) AS march_sales FROM SALES WHERE product_name = 'Novaship' AND order_month = '2026-03-01';"

  - id: Q_NOVASHIP_FEB_SALES
    question: "What was the total sales amount for Novaship in February 2026?"
    domain: sales
    required_tools: [run_sql]
    expected_top_product: "Novaship"
    ground_truth_sql: "SELECT SUM(amount) AS feb_sales FROM SALES WHERE product_name = 'Novaship' AND order_month = '2026-02-01';"

  - id: Q_ORDERS_PER_PRODUCT
    question: "How many distinct orders were placed for each product?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: "SELECT product_name, COUNT(DISTINCT order_id) AS order_count FROM SALES GROUP BY product_name ORDER BY order_count DESC;"

  - id: Q_CRITICAL_SUPPORT_TICKETS
    question: "How many critical priority support tickets were logged?"
    domain: support
    required_tools: [run_sql]
    ground_truth_sql: "SELECT COUNT(*) AS critical_ticket_count FROM SUPPORT_TICKETS WHERE priority = 'Critical';"

  - id: Q_OUTAGE_TICKETS_PRODUCT
    question: "Which products had support tickets related to outages?"
    domain: support
    required_tools: [run_sql]
    expected_top_product: "Novaship"
    ground_truth_sql: "SELECT DISTINCT product_name FROM SUPPORT_TICKETS WHERE category = 'Outage';"

  - id: Q_TICKETS_PER_PRODUCT
    question: "How many support tickets were submitted for each product?"
    domain: support
    required_tools: [run_sql]
    ground_truth_sql: "SELECT product_name, COUNT(*) AS ticket_count FROM SUPPORT_TICKETS GROUP BY product_name ORDER BY ticket_count DESC;"

  - id: Q_MAX_SINGLE_ORDER
    question: "What is the highest single transaction amount recorded in SALES?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: "SELECT MAX(amount) AS max_amount FROM SALES;"

  - id: Q_MIN_SINGLE_ORDER
    question: "What is the lowest single transaction amount recorded in SALES?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: "SELECT MIN(amount) AS min_amount FROM SALES;"

  - id: Q_AVG_QUANTITY_PER_LINE
    question: "What is the average quantity of units per sales line item?"
    domain: sales
    required_tools: [run_sql]
    ground_truth_sql: "SELECT AVG(quantity) AS avg_quantity FROM SALES;"

  - id: Q_PRODUCT_COUNT_BY_CAT
    question: "How many products belong to each category in the catalog?"
    domain: catalog
    required_tools: [run_sql]
    ground_truth_sql: "SELECT category, COUNT(*) AS product_count FROM PRODUCTS GROUP BY category ORDER BY product_count DESC;"

  - id: Q_CLOUDSYNC_TOTAL_REVENUE
    question: "What is the total sales revenue generated specifically by CloudSync?"
    domain: sales
