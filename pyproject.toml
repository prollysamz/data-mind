[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datamind"
version = "0.1.0"
description = "DataMind: Talk to Your Data with verifiable SQL, citations, and deterministic verification"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "DataMind Team" }
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sqlglot>=20.0.0",
    "duckdb>=0.9.0",
]

[project.optional-dependencies]
uploads = ["openpyxl>=3.1.5", "pypdf>=6.0.0"]
snowflake = [
    "snowflake-connector-python>=3.0.0",
]
dev = [
    "openpyxl>=3.1.5",
    "pypdf>=6.0.0",
    "pytest>=7.0.0",
    "detect-secrets>=1.4.0",
    "ruff==0.17.1",
    "snowflake-connector-python>=3.0.0",
]

[project.scripts]
datamind = "datamind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"datamind.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".datamind", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # unicode punctuation in prose strings is intentional
    "SIM102",                      # nested ifs often mirror the verifier's rule structure
    "SIM105",                      # explicit try/except/pass is clearer than contextlib.suppress here
    "SIM108",                      # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"scripts/run_live_trust_suite.py" = ["E402"]  # stdout is reconfigured before imports

