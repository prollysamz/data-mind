[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datamind"
version = "0.1.0"
description = "DataMind: Talk to Your Data with verifiable SQL, citations, and deterministic verification"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "DataMind Team" }
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sqlglot>=20.0.0",
    "duckdb>=0.9.0",
]

[project.optional-dependencies]
snowflake = [
    "snowflake-connector-python>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "detect-secrets>=1.4.0",
    "snowflake-connector-python>=3.0.0",
]

[project.scripts]
datamind = "datamind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"datamind.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
