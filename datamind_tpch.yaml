# TPC-H reusability run: a schema DataMind was never tuned for.
#
# SNOWFLAKE_SAMPLE_DATA is shared into every Snowflake account, so this needs no
# download and no load step. The semantic model was generated by introspection
# (`datamind init`), not written by hand.
#
#   datamind eval --suite tpch --config datamind_tpch.yaml
#
# Needs Snowflake credentials in .env and the DATAMIND_READONLY role (docs/snowflake.md).
# The role only needs IMPORTED PRIVILEGES on SNOWFLAKE_SAMPLE_DATA.
backend:
  type: snowflake
  snowflake:
    account_env: SNOWFLAKE_ACCOUNT
    user_env: SNOWFLAKE_USER
    password_env: SNOWFLAKE_PASSWORD
    role: DATAMIND_READONLY
    warehouse: DATAMIND_XS
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1

semantic_model: examples/tpch/semantic_model.yaml

retrieval:
  index_path: .datamind/fts_tpch.sqlite
  top_k: 5

guardrails:
  max_rows: 1000
  statement_timeout_seconds: 30.0

agent:
  max_steps: 6
  max_sql_repairs: 2
  max_tokens_per_question: 32768
  # 8 tables with opaque TPC-H column names, so prune the schema per question.
  schema_pruning: true
  # Off: this suite measures the model writing SQL for an unfamiliar schema.
  structured_query_lane: false

llm:
  base_url: ${LLM_BASE_URL:-http://localhost:11434/v1}
  api_key_env: LLM_API_KEY
  orchestrator_model: ${LLM_ORCHESTRATOR_MODEL:-gemma4-e2b-16k}
  fast_model: ${LLM_FAST_MODEL:-gemma4-e2b-16k}
  max_tokens: 8192
  temperature: 0.0
  budget:
    max_calls_per_run: 80
    max_tokens_per_call: 32768
    max_calls_per_minute: 60
