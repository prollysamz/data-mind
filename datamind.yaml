# DataMind Application Configuration
backend:
  type: duckdb
  duckdb_path: examples/primary/demo.duckdb

semantic_model: examples/primary/semantic_model.yaml

retrieval:
  index_path: .datamind/fts.sqlite
  top_k: 5

guardrails:
  max_rows: 1000
  statement_timeout_seconds: 30.0

agent:
  max_steps: 6
  max_sql_repairs: 2
  max_tokens_per_question: 32768

llm:
  base_url: ${LLM_BASE_URL:-http://localhost:11434/v1}
  orchestrator_model: ${LLM_ORCHESTRATOR_MODEL:-gemma4:e2b}
  fast_model: ${LLM_FAST_MODEL:-gemma4:e2b}
  token_param: max_tokens
  max_tokens: 8192
  temperature: 0.0
  budget:
    max_usd_total: ${DATAMIND_BUDGET_MAX_USD:-}
    max_usd_per_run: ${DATAMIND_BUDGET_MAX_USD_PER_RUN:-}
    max_calls_per_run: ${DATAMIND_BUDGET_MAX_CALLS_PER_RUN:-300}
    max_tokens_per_call: 16384
    max_calls_per_minute: 60
    price_per_million_input_usd: ${DATAMIND_PRICE_INPUT_M:-}
    price_per_million_output_usd: ${DATAMIND_PRICE_OUTPUT_M:-}
